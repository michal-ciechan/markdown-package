# Publishes the viewer at https://michal-ciechan.github.io/markdown-package/.
# A project site is served from a /<repo>/ subpath, so src/web-viewer/dist/ has to be the
# deployable root: the build emits index.html there with relative asset paths.
name: Deploy viewer to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - 'src/web-viewer/**'
      # V-1 pins the app's remaining dependencies against
      # this evidence, so a change here can turn the build red on its own.
      - 'docs/investigations/viewer-app/**'
      - 'docs/spec/review-fixtures/**'
      - 'docs/investigations/deferred-history/breaking-revision-vectors.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; queue instead of cancelling a live publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/web-viewer/package-lock.json
      # No actions/configure-pages step: its enablement option needs rights the
      # workflow token does not have here ("Resource not accessible by
      # integration"), and every asset path is relative, so nothing needs the
      # base_url it would otherwise supply. Enabling Pages is a one-time
      # repository setting; until it is done the deploy job fails while build
      # still runs as the check.
      - name: Install pinned dependencies
        run: npm ci
        working-directory: src/web-viewer
      # The build is the check: V-1 (dependency pins), V-2
      # (eager graph and gzip budget) and D-1 (relative asset paths) all exit
      # nonzero and withhold dist/ assets on failure.
      - name: Test review schema, selectors and writer
        run: npm test
        working-directory: src/web-viewer
      - name: Build and run the slice gates
        run: npm run build
        working-directory: src/web-viewer
      - name: Install browser test runtime
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: src/web-viewer
      - name: Test browser authoring and download
        run: npx playwright test
        working-directory: src/web-viewer
      - name: Validate browser snapshots with independent ZIP and hash checks
        run: |
          python tests/validate-export.py test-results/browser-review.mdpkg
          python tests/validate-export.py test-results/browser-commit-target.mdpkg
        working-directory: src/web-viewer
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src/web-viewer/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
