name: publish-nuget

# NuGet's policy pins owner/repo/THIS FILENAME and environment nuget.
# Renaming publish-nuget.yml requires updating that policy too.
# Bump src/generator-cli/Mdpkg.Pack.props to release; no tags are used.
on:
  push:
    branches: [master]
    paths:
      - 'src/generator-cli/**'
      # Includes Core/Reader projects, packed READMEs and shared Mdpkg.Pack.props.
      - 'examples/review-consumer/**'
      - 'docs/spec/**'
      - 'docs/spec.md'
      - 'src/web-viewer/tests/fixtures/browser-v2.mdpkg'
      - 'LICENSE'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: src/generator-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/generator-cli/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore, build and test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true
          dotnet test --no-build -c Release
      - name: Pack coordinated packages
        run: |
          set -euo pipefail
          for PROJECT in Mdpkg.Reader Mdpkg.Core Mdpkg.Reviews Mdpkg.Cli; do
            dotnet pack "src/$PROJECT" --no-build -c Release -p:ContinuousIntegrationBuild=true -o artifacts/release
          done
      - name: Inspect packages and prove all local consumers
        run: |
          python tests/verify-consumers.py --local-feed artifacts/release
          python tests/prove-libraries.py --local-feed artifacts/release
          python tests/inspect-release.py artifacts/release --commit "$GITHUB_SHA"
      - name: Prove local global installation
        run: python tests/prove-tool.py --local-feed artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: mdpkg-release-${{ matrix.os }}
          path: |
            src/generator-cli/artifacts/release/*.nupkg
            src/generator-cli/artifacts/release/*.snupkg
            src/generator-cli/artifacts/release/SHA256SUMS
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/generator-cli/global.json
      - uses: actions/download-artifact@v4
        with:
          name: mdpkg-release-ubuntu-latest
          path: out
      - name: Verify artifact checksums
        working-directory: out
        run: sha256sum --check SHA256SUMS
      - name: Check account configuration
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo '::error::Set NUGET_USER to the NuGet profile name in the nuget environment; configure the Trusted Publishing policy described in docs/releases/mdpkg.md.'
            exit 1
          fi
      # Exchange immediately before push: the key expires in one hour.
      - name: NuGet.org login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push Reader, Core, then mdpkg to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oPm1 '(?<=<Version>)[0-9][^<]*' src/generator-cli/Mdpkg.Pack.props)
          # Reader's exact internal ABI must be published before its Core consumer.
          # Reviews is inspected and retained, but is not a public release yet.
          for PACKAGE in Mdpkg.Reader Mdpkg.Core mdpkg; do
            dotnet nuget push "out/$PACKAGE.$VERSION.nupkg" \
              --source https://api.nuget.org/v3/index.json \
              --api-key "$NUGET_API_KEY" --skip-duplicate
          done

  prove-nuget-org:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        product: [tool, libraries]
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/generator-cli/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # No artifact download, local feed, repository build, or push credentials.
      # Only the temporary external library consumers are built.
      - name: Install globally from nuget.org alone and prove pack/deep validate
        if: matrix.product == 'tool'
        run: python src/generator-cli/tests/prove-tool.py --attempts 20 --retry-delay 180
      - name: Restore libraries from nuget.org alone and prove create/deep validate/read
        if: matrix.product == 'libraries'
        run: python src/generator-cli/tests/prove-libraries.py --attempts 20 --retry-delay 180
