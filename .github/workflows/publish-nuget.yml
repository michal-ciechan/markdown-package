name: publish-nuget

# NuGet's policy pins owner/repo/THIS FILENAME and environment nuget.
# Renaming publish-nuget.yml requires updating that policy too.
# Bump src/generator-cli/Mdpkg.Pack.props to release; no tags are used.
on:
  push:
    branches: [master]
    paths:
      - 'src/generator-cli/**'
      - 'LICENSE'
      - '.github/workflows/publish-nuget.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-nuget
  cancel-in-progress: false

jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: src/generator-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/generator-cli/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Restore, build and test
        run: |
          dotnet restore
          dotnet build --no-restore -c Release -p:ContinuousIntegrationBuild=true
          dotnet test --no-build -c Release
      - name: Pack the tool
        run: dotnet pack src/Mdpkg.Cli --no-build -c Release -p:ContinuousIntegrationBuild=true -o artifacts/release
      - name: Prove local global installation
        run: python tests/prove-tool.py --local-feed artifacts/release
      - uses: actions/upload-artifact@v4
        with:
          name: mdpkg-release-${{ matrix.os }}
          path: src/generator-cli/artifacts/release/mdpkg.*.nupkg
          if-no-files-found: error

  publish:
    needs: verify
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: nuget
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/generator-cli/global.json
      - uses: actions/download-artifact@v4
        with:
          name: mdpkg-release-ubuntu-latest
          path: out
      - name: Check account configuration
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo '::error::Set NUGET_USER to the NuGet profile name in the nuget environment; configure the Trusted Publishing policy described in docs/releases/mdpkg.md.'
            exit 1
          fi
      # Exchange immediately before push: the key expires in one hour.
      - name: NuGet.org login
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push only mdpkg to NuGet.org
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          VERSION=$(grep -oPm1 '(?<=<Version>)[0-9][^<]*' src/generator-cli/Mdpkg.Pack.props)
          dotnet nuget push "out/mdpkg.$VERSION.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" --skip-duplicate

  prove-nuget-org:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/generator-cli/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      # No artifact download, local source, build, or push credentials in this job.
      # Up to 57 minutes of indexing waits plus bounded install/command time.
      - name: Install globally from nuget.org alone and prove pack/deep validate
        run: python src/generator-cli/tests/prove-tool.py --attempts 20 --retry-delay 180
