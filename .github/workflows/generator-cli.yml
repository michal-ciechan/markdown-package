# Builds, tests and packs the mdpkg generator CLI. Nothing is published: the .nupkg is
# uploaded as a workflow artifact only.
name: Build generator CLI

on:
  push:
    branches: [master]
    paths:
      - 'src/generator-cli/**'
      # SpecConsistencyTests reads the tool reference and fails when the verb tree, exit
      # codes or diagnostic table drift from it, so a spec edit can turn this red on its own.
      - 'docs/spec/generator-cli.md'
      - 'docs/spec.md'
      - 'docs/spec/worked-example.json'
      - 'docs/spec/review-comments.schema.json'
      - 'docs/spec/review-fixtures/**'
      - 'src/web-viewer/tests/fixtures/browser-v2.mdpkg'
      - 'examples/review-consumer/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/publish-nuget.yml'
      - '.github/workflows/generator-cli.yml'
  pull_request:
    paths:
      - 'src/generator-cli/**'
      - 'docs/spec/generator-cli.md'
      - 'docs/spec.md'
      - 'docs/spec/worked-example.json'
      - 'docs/spec/review-comments.schema.json'
      - 'docs/spec/review-fixtures/**'
      - 'src/web-viewer/tests/fixtures/browser-v2.mdpkg'
      - 'examples/review-consumer/**'
      - 'README.md'
      - 'LICENSE'
      - '.github/workflows/publish-nuget.yml'
      - '.github/workflows/generator-cli.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: src/generator-cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: src/generator-cli/global.json
      - name: Restore
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Test
        run: dotnet test --no-build -c Release
      - name: Pack the tool
        run: dotnet pack src/Mdpkg.Cli/Mdpkg.Cli.csproj --no-build -c Release -o artifacts/package
      - name: Prove global tool installation
        run: python tests/prove-tool.py --local-feed artifacts/package
      - name: Pack read-only libraries
        run: |
          dotnet pack src/Mdpkg.Reader/Mdpkg.Reader.csproj --no-build -c Release -o artifacts/package
          dotnet pack src/Mdpkg.Reviews/Mdpkg.Reviews.csproj --no-build -c Release -o artifacts/package
      - name: Pack Core
        run: dotnet pack src/Mdpkg.Core/Mdpkg.Core.csproj --no-build -c Release -o artifacts/package
      - name: Restore external review consumer
        run: dotnet restore ../../examples/review-consumer --configfile ../../examples/review-consumer/NuGet.Config
      - name: Run external review consumer
        run: dotnet run --no-restore --project ../../examples/review-consumer -- ../../docs/spec/review-fixtures/delta-v2.mdpkg ../../docs/spec/review-fixtures/original.mdpkg
      - name: Verify isolated consumers and installed tool
        run: python tests/verify-consumers.py
      - name: Verify cross-language selector vectors
        run: node ../../docs/spec/review-fixtures/verify-unicode.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: mdpkg-nupkg-${{ matrix.os }}
          path: src/generator-cli/artifacts/package/*.nupkg
          if-no-files-found: error
