[package]
name = "mdpkg-viewer"
version = "1.0.0"
description = "Markdown Package Viewer for Windows"
authors = ["markdown-package contributors"]
edition = "2021"

[lib]
name = "mdpkg_viewer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
